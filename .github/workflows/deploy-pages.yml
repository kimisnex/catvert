name: Deploy site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for API token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "has=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.check.outputs.has == 'true'
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.has == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1ab3b3484eb05fb325a3058065c815a5
          command: pages deploy dist --project-name=catvert
          workingDirectory: site
